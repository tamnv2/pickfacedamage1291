name: Warm v1.4.14 Google Drive Mirror Now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/warm-v1414-release-mirror-now.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warm:
    if: github.repository == 'tamnv2/pickfacedamage1291'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout scope lock
        uses: actions/checkout@v4

      - name: Verify fixed project scope
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'tamnv2/pickfacedamage1291' PROJECT_SCOPE_LOCK.md
          grep -Fq '16jDCy5_Z1X5cKJyNPR1rn_ZqbExQSAeC' PROJECT_SCOPE_LOCK.md
          grep -Fq 'pickface-damage-1291' PROJECT_SCOPE_LOCK.md

      - name: Warm latest release through approved Google gateway
        shell: bash
        env:
          GATEWAY_URL: https://script.google.com/macros/s/AKfycbwfB-NdKPRj-GN4T_MRS89aaJ8ihRsPfT9qd2wUhBntOAOtBF1ycuaNJRdYN5JCFf12/exec
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            BODY="$(curl -sSL --max-time 330 \
              -H 'Content-Type: application/json' \
              --data '{"action":"warm_release_mirror","payload":{}}' \
              "$GATEWAY_URL" || true)"

            if RESPONSE="$BODY" node <<'NODE'
          const data = JSON.parse(process.env.RESPONSE || '{}');
          if (data.ok !== true || data.mirror_ready !== true) process.exit(2);
          if (data.tag !== 'v1.4.14') process.exit(3);
          if (data.asset_name !== 'PickfaceDamage1291-win-x64-v1.4.14.zip') process.exit(4);
          if (!/^sha256:[0-9a-f]{64}$/i.test(data.digest || '')) process.exit(5);
          NODE
            then
              echo 'Drive mirror v1.4.14 PASS.'
              exit 0
            fi

            echo "Mirror chưa sẵn sàng (lần $attempt/18); chờ 10 giây..."
            sleep 10
          done

          echo '::error::Không warm được v1.4.14 vào Drive root đã phê duyệt.'
          exit 1
