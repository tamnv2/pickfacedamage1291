name: Fix v1.3.7 Reflow Guard

on:
  push:
    branches:
      - fix/v1.3.6-responsive-delete-dedup

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.3.6-responsive-delete-dedup
          fetch-depth: 0
      - name: Apply reflow guard
        run: python3 scripts/fix_v137_reflow.py
      - name: Remove helper
        run: git rm scripts/fix_v137_reflow.py .github/workflows/fix-v137-reflow.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v1.3.7: guard responsive flow reflow"
          git push origin HEAD:fix/v1.3.6-responsive-delete-dedup
