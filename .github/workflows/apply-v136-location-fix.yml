name: Apply v1.3.6 Location Fix

on:
  push:
    branches:
      - fix/v1.3.6-restore-lta-shelving
    paths:
      - .github/workflows/apply-v136-location-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/v1.3.6-restore-lta-shelving
          fetch-depth: 0

      - name: Apply source patch
        run: python3 scripts/patch_v136_location.py

      - name: Remove temporary patch helpers
        run: git rm scripts/patch_v136_location.py .github/workflows/apply-v136-location-fix.yml

      - name: Commit fixed sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v1.3.6: restore automatic LTA and Shelving locations"
          git push origin HEAD:fix/v1.3.6-restore-lta-shelving
