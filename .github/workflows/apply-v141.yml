name: Apply v1.4.1 Fixes

on:
  push:
    branches:
      - fix/v1.4.1-admin-network-edit-export
    paths:
      - .github/workflows/apply-v141.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/v1.4.1-admin-network-edit-export
          fetch-depth: 0

      - name: Validate and apply patch
        shell: pwsh
        run: |
          python -m py_compile scripts/apply_v141.py scripts/fix_v141_build.py
          python scripts/apply_v141.py
          python scripts/fix_v141_build.py

      - name: Remove temporary patch helpers
        shell: pwsh
        run: |
          Remove-Item scripts/apply_v141.py -Force
          Remove-Item scripts/fix_v141_build.py -Force
          Remove-Item .github/workflows/apply-v141.yml -Force
          if (Test-Path scripts/__pycache__) { Remove-Item scripts/__pycache__ -Recurse -Force }

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/PickfaceDamage1291/PickfaceDamage1291.csproj

      - name: Build
        run: dotnet build src/PickfaceDamage1291/PickfaceDamage1291.csproj -c Release --no-restore

      - name: Commit patched sources
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (git diff --cached --quiet) { throw 'No source changes to commit' }
          git commit -m "v1.4.1: fix admin network handling, report edit images and Excel export"
          git push origin HEAD:fix/v1.4.1-admin-network-edit-export
