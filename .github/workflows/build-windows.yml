name: Build Windows Portable

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/BbbgTemplateProbe/**'
      - 'tools/ExportCompatibilityProbe/**'
      - 'tools/verify-owner-logo.ps1'
      - 'tools/verify-v1428-regressions.ps1'
      - '.github/workflows/build-windows.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/BbbgTemplateProbe/**'
      - 'tools/ExportCompatibilityProbe/**'
      - 'tools/verify-owner-logo.ps1'
      - 'tools/verify-v1428-regressions.ps1'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify exact OWNER logo
        shell: pwsh
        run: ./tools/verify-owner-logo.ps1

      - name: Verify v1.4.28 regressions
        shell: pwsh
        run: ./tools/verify-v1428-regressions.ps1

      - name: Probe approved BBBG template
        shell: pwsh
        run: |
          dotnet run --project tools/BbbgTemplateProbe/BbbgTemplateProbe.csproj -- "src/PickfaceDamage1291/BbbgInventoryTemplateV1424.cs"

      - name: Restore
        run: dotnet restore src/PickfaceDamage1291/PickfaceDamage1291.csproj

      - name: Probe Excel export compatibility
        run: dotnet run --project tools/ExportCompatibilityProbe/ExportCompatibilityProbe.csproj -c Release

      - name: Publish portable EXE
        run: >-
          dotnet publish src/PickfaceDamage1291/PickfaceDamage1291.csproj
          -c Release
          -r win-x64
          --self-contained true
          -o publish/win-x64
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Verify EXE
        shell: pwsh
        run: |
          if (!(Test-Path "publish/win-x64/PickfaceDamage1291.exe")) {
            throw "Không tìm thấy PickfaceDamage1291.exe sau publish"
          }
          Get-Item "publish/win-x64/PickfaceDamage1291.exe" | Format-List Name,Length,LastWriteTime

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PickfaceDamage1291-win-x64
          path: publish/win-x64/
          if-no-files-found: error
          retention-days: 30
