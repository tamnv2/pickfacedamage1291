name: Publish Windows Release

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/release-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'tamnv2/pickfacedamage1291'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content 'src/PickfaceDamage1291/PickfaceDamage1291.csproj'
          $version = [string]$project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Không đọc được Version từ csproj' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Check existing release
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release view $env:TAG --repo tamnv2/pickfacedamage1291 *> $null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - name: Restore
        if: steps.existing.outputs.exists != 'true'
        run: dotnet restore src/PickfaceDamage1291/PickfaceDamage1291.csproj

      - name: Publish portable EXE
        if: steps.existing.outputs.exists != 'true'
        run: >-
          dotnet publish src/PickfaceDamage1291/PickfaceDamage1291.csproj
          -c Release
          -r win-x64
          --self-contained true
          -o publish/win-x64
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Package release
        if: steps.existing.outputs.exists != 'true'
        id: package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $zip = "PickfaceDamage1291-win-x64-v$env:VERSION.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path 'publish/win-x64/*' -DestinationPath $zip -CompressionLevel Optimal
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          gh release create $env:TAG $env:ZIP --repo tamnv2/pickfacedamage1291 --target $env:GITHUB_SHA --title "Pickface Damage 1291 v$env:VERSION" --notes "Windows portable win-x64. Ứng dụng kiểm tra GitHub Release để tự cập nhật."
