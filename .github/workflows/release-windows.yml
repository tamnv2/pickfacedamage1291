name: Publish Windows Release

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/ExportCompatibilityProbe/**'
      - 'tools/verify-owner-logo.ps1'
      - 'tools/verify-v1428-regressions.ps1'
      - '.github/workflows/release-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'tamnv2/pickfacedamage1291'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify exact OWNER logo
        shell: pwsh
        run: ./tools/verify-owner-logo.ps1

      - name: Verify v1.4.28 regressions
        shell: pwsh
        run: ./tools/verify-v1428-regressions.ps1

      - name: Probe Excel export compatibility
        run: dotnet run --project tools/ExportCompatibilityProbe/ExportCompatibilityProbe.csproj -c Release

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content 'src/PickfaceDamage1291/PickfaceDamage1291.csproj'
          $version = [string]$project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Không đọc được Version từ csproj' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Check existing release
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release view $env:TAG --repo tamnv2/pickfacedamage1291 *> $null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - name: Restore
        if: steps.existing.outputs.exists != 'true'
        run: dotnet restore src/PickfaceDamage1291/PickfaceDamage1291.csproj

      - name: Publish portable EXE
        if: steps.existing.outputs.exists != 'true'
        run: >-
          dotnet publish src/PickfaceDamage1291/PickfaceDamage1291.csproj
          -c Release
          -r win-x64
          --self-contained true
          -o publish/win-x64
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Package release
        if: steps.existing.outputs.exists != 'true'
        id: package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $zip = "PickfaceDamage1291-win-x64-v$env:VERSION.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path 'publish/win-x64/*' -DestinationPath $zip -CompressionLevel Optimal
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          gh release create $env:TAG $env:ZIP --repo tamnv2/pickfacedamage1291 --target $env:GITHUB_SHA --title "Pickface Damage 1291 v$env:VERSION" --notes "Windows portable win-x64. Ứng dụng kiểm tra GitHub Release để tự cập nhật."


  warm_release_mirror:
    name: Warm Google Drive Release Mirror
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APPS_SCRIPT_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID || vars.APPS_SCRIPT_DEPLOYMENT_ID }}

    steps:
      - name: Verify fixed project scope
        shell: bash
        run: |
          set -euo pipefail
          test -n "${APPS_SCRIPT_DEPLOYMENT_ID:-}"
          RAW_DEPLOY="${APPS_SCRIPT_DEPLOYMENT_ID%%\?*}"
          if [[ "$RAW_DEPLOY" == https://script.google.com/macros/s/* ]]; then
            DEPLOYMENT_ID="${RAW_DEPLOY#https://script.google.com/macros/s/}"
            DEPLOYMENT_ID="${DEPLOYMENT_ID%%/*}"
          else
            DEPLOYMENT_ID="$RAW_DEPLOY"
          fi
          test -n "$DEPLOYMENT_ID"
          printf 'GATEWAY_URL=https://script.google.com/macros/s/%s/exec\n' "$DEPLOYMENT_ID" >> "$GITHUB_ENV"

      - name: Warm latest release into approved Drive root
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            echo "Mirror warm attempt $attempt/18"
            BODY="$(curl -sSL --max-time 330 \
              -H 'Content-Type: application/json' \
              --data '{"action":"warm_release_mirror","payload":{}}' \
              "$GATEWAY_URL" || true)"

            if RESPONSE="$BODY" node <<'NODE'
          const raw = process.env.RESPONSE || '';
          let data;
          try { data = JSON.parse(raw); } catch (_) { process.exit(2); }
          if (data.ok !== true) process.exit(3);
          if (data.mirror_ready !== true) process.exit(4);
          if (!data.tag || !data.asset_name || !/^sha256:[0-9a-f]{64}$/i.test(data.digest || '')) process.exit(5);
          NODE
            then
              echo "Google Drive release mirror PASS."
              exit 0
            fi

            echo "Mirror chưa sẵn sàng; chờ 10 giây..."
            sleep 10
          done

          echo "::error::Không warm được release mirror qua Google gateway sau 18 lần thử."
          exit 1
