name: Apply v1.3.5 UI Fix

on:
  push:
    branches:
      - fix/v1.3.5-ui-button-consistency

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/v1.3.5-ui-button-consistency
          fetch-depth: 0

      - name: Normalize version metadata for patch helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/PickfaceDamage1291/PickfaceDamage1291.csproj')
          text = p.read_text(encoding='utf-8')
          text = text.replace('    <InformationalVersion>1.3.4</InformationalVersion>\n', '')
          p.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Apply source patch
        run: python3 scripts/patch_v135_ui.py

      - name: Restore informational version metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/PickfaceDamage1291/PickfaceDamage1291.csproj')
          text = p.read_text(encoding='utf-8')
          marker = '    <Version>1.3.5</Version>\n'
          if marker not in text:
              raise SystemExit('v1.3.5 Version marker missing')
          text = text.replace(marker, marker + '    <InformationalVersion>1.3.5</InformationalVersion>\n', 1)
          p.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Remove temporary patch helpers
        run: git rm scripts/patch_v135_ui.py .github/workflows/apply-v135-ui-fix.yml

      - name: Commit fixed sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v1.3.5: unify section 4 and button layout"
          git push origin HEAD:fix/v1.3.5-ui-button-consistency
