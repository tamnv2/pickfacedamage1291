name: Deploy Google Apps Script

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps-script/GoogleGateway/**'
      - '.github/workflows/deploy-apps-script.yml'

permissions:
  contents: read

concurrency:
  group: pickface-damage-1291-gas-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
      APPS_SCRIPT_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID || vars.APPS_SCRIPT_DEPLOYMENT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify project scope
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "PROJECT_ID: 'pickface-damage-1291'" apps-script/GoogleGateway/Code.gs
          grep -Fq "ROOT_FOLDER_ID: '16jDCy5_Z1X5cKJyNPR1rn_ZqbExQSAeC'" apps-script/GoogleGateway/Code.gs
          grep -Fq "const GATEWAY_VERSION = '1.4.5'" apps-script/GoogleGateway/Code.gs
          grep -Fq "'rtdb_proxy'" apps-script/GoogleGateway/Code.gs
          grep -Fq "GATEWAY_VERSION_V1410 = '1.4.12'" apps-script/GoogleGateway/HardDeleteV1410.gs
          grep -Fq "hard_delete_reports" apps-script/GoogleGateway/HardDeleteV1410.gs
          grep -Fq "firebase_refresh_session" apps-script/GoogleGateway/HardDeleteV1410.gs
          grep -Fq "firebase_admin_create_user" apps-script/GoogleGateway/HardDeleteV1410.gs
          test -f apps-script/GoogleGateway/OfficeNetworkV1412.gs

      - name: Configure clasp safely
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLASPRC_JSON:-}"
          test -n "${APPS_SCRIPT_ID:-}"
          test -n "${APPS_SCRIPT_DEPLOYMENT_ID:-}"

          node <<'NODE'
          const fs = require('fs');
          const raw = (process.env.CLASPRC_JSON || '').trim();
          const first = raw.indexOf('{');
          const last = raw.lastIndexOf('}');
          if (first < 0 || last <= first) {
            console.error('CLASPRC_JSON không chứa JSON hợp lệ.');
            process.exit(1);
          }
          const candidate = raw.slice(first, last + 1);
          let parsed;
          try {
            parsed = JSON.parse(candidate);
          } catch (_) {
            console.error('CLASPRC_JSON vẫn không parse được sau khi loại phần thừa trước/sau JSON.');
            process.exit(1);
          }
          fs.writeFileSync(`${process.env.HOME}/.clasprc.json`, JSON.stringify(parsed));
          fs.chmodSync(`${process.env.HOME}/.clasprc.json`, 0o600);
          fs.writeFileSync('.clasp.json', JSON.stringify({
            scriptId: process.env.APPS_SCRIPT_ID.trim(),
            rootDir: 'apps-script/GoogleGateway'
          }, null, 2));
          NODE

          RAW_DEPLOY="${APPS_SCRIPT_DEPLOYMENT_ID%%\?*}"
          if [[ "$RAW_DEPLOY" == https://script.google.com/macros/s/* ]]; then
            DEPLOYMENT_ID="${RAW_DEPLOY#https://script.google.com/macros/s/}"
            DEPLOYMENT_ID="${DEPLOYMENT_ID%%/*}"
          else
            DEPLOYMENT_ID="$RAW_DEPLOY"
          fi
          test -n "$DEPLOYMENT_ID"
          printf 'DEPLOYMENT_ID=%s\n' "$DEPLOYMENT_ID" >> "$GITHUB_ENV"
          printf 'GATEWAY_URL=https://script.google.com/macros/s/%s/exec\n' "$DEPLOYMENT_ID" >> "$GITHUB_ENV"

      - name: Verify OAuth and deployment target
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYMENTS="$(npx --yes @google/clasp@3 deployments)"
          if ! grep -Fq "$DEPLOYMENT_ID" <<<"$DEPLOYMENTS"; then
            echo "::error::Deployment ID không thuộc Apps Script project đã cấu hình."
            exit 1
          fi

      - name: Push GAS source
        shell: bash
        run: |
          set -euo pipefail
          npx --yes @google/clasp@3 push --force

      - name: Create immutable GAS version
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(npx --yes @google/clasp@3 version "GitHub main ${GITHUB_SHA::7}")"
          VERSION="$(sed -nE 's/.*[Vv]ersion[[:space:]]+([0-9]+).*/\1/p' <<<"$OUT" | tail -1)"
          if [[ ! "$VERSION" =~ ^[0-9]+$ ]]; then
            echo "::error::Không xác định được Apps Script version vừa tạo."
            exit 1
          fi
          printf 'GAS_VERSION=%s\n' "$VERSION" >> "$GITHUB_ENV"

      - name: Redeploy existing web app
        shell: bash
        run: |
          set -euo pipefail
          npx --yes @google/clasp@3 update-deployment "$DEPLOYMENT_ID" \
            -V "$GAS_VERSION" \
            -d "GitHub main ${GITHUB_SHA::7}"

      - name: Verify deployment and live gateway
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYMENTS="$(npx --yes @google/clasp@3 deployments)"
          grep -Fq "$DEPLOYMENT_ID" <<<"$DEPLOYMENTS"

          for attempt in $(seq 1 12); do
            RESPONSE="$(curl -sSL \
              -H 'Content-Type: application/json' \
              --data '{"action":"gateway_info","payload":{}}' \
              -w '\n%{http_code}' \
              "$GATEWAY_URL" || true)"

            HTTP_CODE="${RESPONSE##*$'\n'}"
            BODY="${RESPONSE%$'\n'*}"

            if [[ "$HTTP_CODE" == "200" ]]; then
              if RESPONSE="$BODY" node <<'NODE'
          const data = JSON.parse(process.env.RESPONSE || '{}');
          if (data.ok !== true) process.exit(2);
          if (data.version !== '1.4.12') process.exit(3);
          const caps = Array.isArray(data.capabilities) ? data.capabilities : [];
          for (const cap of ['rtdb_proxy','hard_delete_reports','firebase_refresh_session','firebase_admin_create_user','adaptive_office_route_v1412']) {
            if (!caps.includes(cap)) process.exit(4);
          }
          NODE
              then
                echo "Gateway live PASS: version 1.4.12, Office/PDA adaptive capabilities available."
                exit 0
              fi
            fi

            echo "Gateway live chưa sẵn sàng (lần $attempt/12, HTTP $HTTP_CODE); chờ 5 giây..."
            sleep 5
          done

          echo "::error::Gateway live chưa trả version 1.4.12 + Office/PDA adaptive capabilities sau thời gian chờ propagation."
          exit 1

      - name: Cleanup credentials
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.clasprc.json" .clasp.json
