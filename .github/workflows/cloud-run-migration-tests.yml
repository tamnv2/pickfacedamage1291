name: Pickface Cloud Run Migration Source Tests
on:
  push:
    branches: ['work/pfd-001-cloud-run-migration']
    paths: ['cloud-run/**']
  pull_request:
    paths: ['cloud-run/**']
permissions:
  contents: read
jobs:
  node-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test cloud-run/*.test.mjs
