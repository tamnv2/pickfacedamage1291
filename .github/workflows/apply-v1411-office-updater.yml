name: Apply v1.4.11 Office Updater Fallback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v1411-office-updater.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'tamnv2/pickfacedamage1291'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify fixed scope and gateway route
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "PROJECT_ID: 'pickface-damage-1291'" apps-script/GoogleGateway/Code.gs
          grep -Fq "ROOT_FOLDER_ID: '16jDCy5_Z1X5cKJyNPR1rn_ZqbExQSAeC'" apps-script/GoogleGateway/Code.gs
          grep -Fq "action === 'release_mirror_manifest'" apps-script/GoogleGateway/HardDeleteV1410.gs
          grep -Fq "REPOSITORY: 'tamnv2/pickfacedamage1291'" apps-script/GoogleGateway/ReleaseMirrorV1411.gs

      - name: Apply source patch
        shell: bash
        run: python3 tools/apply_v1411_office_updater.py

      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'GatewayHttp = CreateGatewayHttpClient()' src/PickfaceDamage1291/VersionUpdateServiceV2.cs
          grep -Fq 'release_mirror_manifest' src/PickfaceDamage1291/VersionUpdateServiceV2.cs
          grep -Fq 'release_mirror_chunk' src/PickfaceDamage1291/VersionUpdateServiceV2.cs
          grep -Fq '<Version>1.4.11</Version>' src/PickfaceDamage1291/PickfaceDamage1291.csproj
          grep -Fq 'Google Drive dự phòng' src/PickfaceDamage1291/MainFormV3.cs

      - name: Commit v1.4.11 source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/PickfaceDamage1291/VersionUpdateServiceV2.cs src/PickfaceDamage1291/MainFormV3.cs src/PickfaceDamage1291/PickfaceDamage1291.csproj; then
            echo "v1.4.11 source đã có; không cần commit."
            exit 0
          fi
          git config user.name "tamnv2"
          git config user.email "nguyenvantam050595@gmail.com"
          git add src/PickfaceDamage1291/VersionUpdateServiceV2.cs src/PickfaceDamage1291/MainFormV3.cs src/PickfaceDamage1291/PickfaceDamage1291.csproj
          git commit -m "release v1.4.11 office network updater fallback"
          git push origin HEAD:main
