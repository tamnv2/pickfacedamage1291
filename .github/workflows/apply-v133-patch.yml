name: Apply v1.3.3 Patch

on:
  push:
    branches:
      - fix/v1.3.3-ui-validation-account
    paths:
      - .github/workflows/apply-v133-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/v1.3.3-ui-validation-account
          fetch-depth: 0

      - name: Apply source patch
        run: python3 tools/apply_v133_patch.py

      - name: Commit patched sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/PickfaceDamage1291/Program.cs \
                  src/PickfaceDamage1291/V132Runtime.cs \
                  src/PickfaceDamage1291/UiRuntimeFixesV2.cs \
                  src/PickfaceDamage1291/EntryUiHelpers.cs \
                  src/PickfaceDamage1291/DamageReportEditDialog.cs \
                  src/PickfaceDamage1291/PickfaceDamage1291.csproj \
                  apps-script/GoogleGateway/Code.gs
          git commit -m "v1.3.3: stabilize UI, validate inputs and add account self-service"
          git push origin HEAD:fix/v1.3.3-ui-validation-account
