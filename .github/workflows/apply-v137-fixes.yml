name: Apply v1.3.7 Fixes

on:
  push:
    branches:
      - fix/v1.3.6-responsive-delete-dedup

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/v1.3.6-responsive-delete-dedup
          fetch-depth: 0

      - name: Apply source patch
        run: python3 scripts/patch_v136.py

      - name: Remove temporary maintenance artifacts
        run: git rm scripts/patch_v136.py .github/workflows/apply-v137-fixes.yml NOOP

      - name: Commit fixed sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v1.3.7: responsive buttons, admin delete, duplicate guard"
          git push origin HEAD:fix/v1.3.6-responsive-delete-dedup
