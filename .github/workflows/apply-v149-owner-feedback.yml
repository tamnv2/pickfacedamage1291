name: Apply v1.4.9 Owner Feedback

on:
  push:
    branches:
      - fix/v1.4.9-owner-feedback-stage2
    paths:
      - '.github/workflows/apply-v149-owner-feedback.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-release:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: fix/v1.4.9-owner-feedback-stage2
          fetch-depth: 0

      - name: Verify project scope
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'tamnv2/pickfacedamage1291' PROJECT_SCOPE_LOCK.md
          grep -Fq '16jDCy5_Z1X5cKJyNPR1rn_ZqbExQSAeC' PROJECT_SCOPE_LOCK.md
          grep -Fq 'pickface-damage-1291' PROJECT_SCOPE_LOCK.md
          grep -Fq "PROJECT_ID: 'pickface-damage-1291'" apps-script/GoogleGateway/Code.gs
          grep -Fq "ROOT_FOLDER_ID: '16jDCy5_Z1X5cKJyNPR1rn_ZqbExQSAeC'" apps-script/GoogleGateway/Code.gs

      - name: Apply source corrections
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply_v149_owner_feedback.py

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/PickfaceDamage1291/PickfaceDamage1291.csproj

      - name: Publish portable EXE
        run: >-
          dotnet publish src/PickfaceDamage1291/PickfaceDamage1291.csproj
          -c Release
          -r win-x64
          --self-contained true
          -o publish/win-x64
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Verify EXE
        shell: pwsh
        run: |
          if (!(Test-Path "publish/win-x64/PickfaceDamage1291.exe")) {
            throw "Không tìm thấy PickfaceDamage1291.exe sau publish"
          }
          Get-Item "publish/win-x64/PickfaceDamage1291.exe" | Format-List Name,Length,LastWriteTime

      - name: Commit verified patch on staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/PickfaceDamage1291/V147Runtime.cs \
            src/PickfaceDamage1291/V148Runtime.cs \
            src/PickfaceDamage1291/AvailableDatePickerV149.cs \
            src/PickfaceDamage1291/DamageReportExportV148.cs \
            src/PickfaceDamage1291/FirebaseClient.cs \
            src/PickfaceDamage1291/PickfaceDamage1291.csproj \
            firebase/database.rules.json
          git commit -m "fix v1.4.9 owner feedback"
          PATCH_BRANCH_SHA="$(git rev-parse HEAD)"
          git push origin HEAD:fix/v1.4.9-owner-feedback-stage2
          printf 'PATCH_BRANCH_SHA=%s\n' "$PATCH_BRANCH_SHA" >> "$GITHUB_ENV"

      - name: Promote only verified source patch to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B v149-promote origin/main
          git cherry-pick "$PATCH_BRANCH_SHA"
          RELEASE_SHA="$(git rev-parse HEAD)"
          git push origin HEAD:main
          printf 'RELEASE_SHA=%s\n' "$RELEASE_SHA" >> "$GITHUB_ENV"

      - name: Package v1.4.9
        shell: pwsh
        run: |
          $zip = "PickfaceDamage1291-win-x64-v1.4.9.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path 'publish/win-x64/*' -DestinationPath $zip -CompressionLevel Optimal

      - name: Create v1.4.9 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v1.4.9 \
            PickfaceDamage1291-win-x64-v1.4.9.zip \
            --repo tamnv2/pickfacedamage1291 \
            --target "$RELEASE_SHA" \
            --title "Pickface Damage 1291 v1.4.9" \
            --notes "Fix OWNER feedback: location typing freeze/event storm, date/all report filtering, available-date calendar, Excel naming by selected entry date and shift, and self display-name update using least-privilege child write."

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PickfaceDamage1291-win-x64-v1.4.9
          path: PickfaceDamage1291-win-x64-v1.4.9.zip
          if-no-files-found: error
          retention-days: 30
